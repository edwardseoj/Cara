services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cara
      POSTGRES_PASSWORD: cara
      POSTGRES_DB: cara
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # shortcut: init scripts run only on an empty volume, add a migration runner with the 2nd migration
      - ./training/migrations:/docker-entrypoint-initdb.d:ro

  # GPU training container; start with `docker compose run --rm train`
  train:
    profiles: [train]
    build: ./training
    command: python -m cara_training.check_gpu
    environment:
      DATABASE_URL: postgresql://cara:cara@postgres:5432/cara
    volumes:
      - ./training/models:/work/models  # exported models land in training/models/static (gitignored)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
