name: CI

on:
  pull_request:
  push:
    branches: [develop/setup, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  training:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cara
          POSTGRES_PASSWORD: cara
          POSTGRES_DB: cara
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/pyproject.toml
      # service containers can't use docker-entrypoint-initdb.d, so apply migrations by hand
      - name: Apply migrations
        env:
          PGPASSWORD: cara
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          for f in $(ls migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U cara -d cara -f "$f"
          done
      - run: pip install -e ".[dev]"
      - run: pytest -rs

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - run: pip install -e ".[dev,viewer]"
      - run: pytest -rs tests/test_viewer.py
