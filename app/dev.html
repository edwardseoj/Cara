<!doctype html>
<!-- Dev UI: index.html plus the recording form. Loaded only when unpackaged; excluded from builds. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8765; media-src 'self' mediastream:">
<title>Cara Dev UI</title>
<style>
  body { margin: 0; background: #000; color: #eee; font: 14px sans-serif; display: flex; gap: 16px; }
  #stage { position: relative; width: 640px; height: 480px; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  form { display: grid; gap: 8px; padding: 16px; align-content: start; }
</style>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" width="640" height="480"></canvas>
</div>
<form id="dev">
  <label>Recorder ID <input name="recorder_id" required></label>
  <label>Lighting <input name="lighting" required></label>
  <label>Camera <input name="camera" required></label>
  <button id="start" type="button">Start recording session</button>
  <label>Gesture <select name="label"></select></label>
  <label>Frames per sample <input name="frames" type="number" min="1"></label>
  <label>Countdown (s) <input name="countdown" type="number" min="0" value="3"></label>
  <button id="record" type="button" disabled>Record</button>
  <output id="status"></output>
</form>
<script type="module" src="dev/dev-ui.mjs"></script>
<script type="module" src="renderer.mjs"></script>
