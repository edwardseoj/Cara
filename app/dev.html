<!doctype html>
<html class="dark">
<!-- Dev UI: index.html plus the recording form. Loaded only when unpackaged; excluded from builds. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8765; media-src 'self' mediastream:">
<title>Cara Dev UI</title>
<link rel="stylesheet" href="dev/dev-ui.css">
<style>
  #stage > video, #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
</style>
<body class="flex h-screen overflow-hidden bg-background text-foreground font-sans text-sm">
<div id="stage" class="relative shrink-0 w-[640px] h-[480px] bg-black">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" width="640" height="480"></canvas>
  <div id="stage-overlay" class="absolute inset-0 grid place-items-center pointer-events-none" aria-hidden="true">
    <span id="stage-countdown" class="text-9xl font-bold text-white drop-shadow-lg" hidden></span>
    <span id="stage-recording" class="absolute top-4 left-4 rounded-md bg-red-600 px-3 py-1 text-base font-semibold text-white" hidden>Recording</span>
  </div>
</div>
<form id="dev" class="w-[420px] h-full overflow-y-auto p-4 flex flex-col gap-4 [&>*]:shrink-0">
  <section class="card">
    <header class="flex items-center justify-between"><h2>Recording session</h2><span class="badge" id="session-badge" hidden></span></header>
    <section class="grid gap-3">
      <div class="grid gap-2"><label class="label" for="recorder_id">Recorder ID</label><input class="input" id="recorder_id" name="recorder_id" required></div>
      <div class="grid gap-2"><label class="label" for="lighting">Lighting</label><input class="input" id="lighting" name="lighting" required></div>
      <div class="grid gap-2"><label class="label" for="camera">Camera</label><input class="input" id="camera" name="camera" required></div>
      <button class="btn" id="start" type="button">Start recording session</button>
      <output id="session-status" class="text-muted-foreground" hidden></output>
    </section>
  </section>
  <section class="card">
    <header><h2>Record sample</h2></header>
    <section class="grid gap-3">
      <div class="grid gap-2"><label class="label" for="label">Gesture</label><select class="select w-full" id="label" name="label"></select></div>
      <div class="grid gap-2"><label class="label" for="frames">Frames per sample</label><input class="input" id="frames" name="frames" type="number" min="1"></div>
      <div class="grid gap-2"><label class="label" for="countdown">Countdown (s)</label><input class="input" id="countdown" name="countdown" type="number" min="0" value="3"></div>
      <button class="btn" id="record" type="button" disabled>Record sample</button>
      <output id="status" class="text-muted-foreground" hidden></output>
    </section>
  </section>
  <section class="card">
    <header><h2>Dataset</h2></header>
    <section class="grid gap-3">
      <table class="table"><caption>Samples per gesture</caption><thead><tr><th>Gesture</th><th>Samples</th></tr></thead><tbody id="gesture-counts"></tbody></table>
      <table class="table"><caption>Samples per recording session</caption><thead><tr><th>Recording session</th><th>Samples</th></tr></thead><tbody id="session-counts"></tbody></table>
      <div class="grid gap-2"><label class="label" for="delete-id">Sample ID</label><input class="input" id="delete-id" type="number" min="1"></div>
      <button class="btn-destructive" id="delete" type="button">Delete sample</button>
      <output id="dataset-error" class="alert" data-variant="destructive" hidden></output>
    </section>
  </section>
  <section class="card">
    <header><h2>Training</h2></header>
    <section class="grid gap-3">
      <div class="grid gap-2"><label class="label" for="model-kind">Model kind</label><select class="select w-full" id="model-kind"><option value="static">static gestures</option><option value="motion">motion gestures</option></select></div>
      <button class="btn" id="train" type="button">Start training</button>
      <div class="grid gap-1 text-sm"><p id="train-title" class="font-medium"></p><dl id="train-metrics" class="grid grid-cols-2 gap-x-4 text-muted-foreground"></dl><p id="train-error" class="alert" data-variant="destructive" hidden></p></div>
    </section>
  </section>
</form>
<script type="module" src="dev/samples.mjs"></script>
<script type="module" src="dev/train.mjs"></script>
<script type="module" src="dev/dev-ui.mjs"></script>
<script type="module" src="renderer.mjs"></script>
